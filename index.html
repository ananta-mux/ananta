<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="10;url=https://t-strip.github.io/" />
  <link rel="canonical" href="https://t-strip.github.io/" />
  <title>Project Renamed to t-strip</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #11111b;
      color: #cdd6f4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background-color: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      color: #89b4fa;
    }
    p {
      line-height: 1.6;
      color: #bac2de;
    }
    .timer {
      font-weight: bold;
      color: #a6e3a1;
    }
    .btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      background-color: #89b4fa;
      color: #11111b;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ananta has been renamed to t-strip</h1>
    <p>
      This project has moved to a new home. You will be redirected automatically in 
      <span id="countdown" class="timer">10</span> seconds.
    </p>
    <a href="https://t-strip.github.io/" class="btn">Go to New Build</a>
  </div>

  <script>
    let seconds = 10;
    const targetUrl = "https://t-strip.github.io/";
    const countdownEl = document.getElementById("countdown");

    const interval = setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) {
        clearInterval(interval);
        countdownEl.textContent = "0";
        window.location.replace(targetUrl);
      } else {
        countdownEl.textContent = seconds;
      }
    }, 1000);
  </script>
</body>
</html>
