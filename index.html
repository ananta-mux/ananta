<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ananta is now T-Strip — Redirecting...</title>
  <link rel="canonical" href="https://github.io">
  <meta http-equiv="refresh" content="5; url=https://github.io">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #111822;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .timer {
      color: var(--text);
      font-weight: 700;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #061019;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PROJECT RENAMED</div>
    <h1>Ananta is now T-Strip</h1>
    <p>
      This project has moved to a new home.<br>
      Redirecting to <strong>t-strip.github.io</strong> in <span id="countdown" class="timer">5</span>s...
    </p>
    <a class="btn" href="https://github.io">Go to T-Strip &rarr;</a>
  </div>

  <script>
    let seconds = 5;
    const el = document.getElementById("countdown");
    const target = "https://github.io";

    const interval = setInterval(() => {
      seconds -= 1;
      if (seconds > 0) {
        el.textContent = seconds;
      } else {
        el.textContent = "0";
        clearInterval(interval);
        window.location.replace(target);
      }
    }, 1000);
  </script>
</body>
</html>
